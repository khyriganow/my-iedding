<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — Чайный магазин</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#f7f5f2;color:#2c2c2c;line-height:1.5}
  .container{max-width:1200px;margin:0 auto;padding:0 24px}
  header{padding:24px 0;background:#fff;border-bottom:1px solid #eee}
  header .container{display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:700;font-size:1.3rem;color:#2c2c2c}
  .cart{background:#2c2c2c;color:#fff;padding:10px 20px;border-radius:50px;font-size:.9rem;text-decoration:none}
  .title{padding:60px 0 40px}
  .title h1{font-size:2.4rem;margin-bottom:10px}
  .title p{color:#777}
  .filters{display:flex;gap:10px;margin-bottom:40px;flex-wrap:wrap}
  .filter{
    padding:10px 22px;border:1px solid #ddd;border-radius:50px;background:#fff;
    cursor:pointer;font-size:.9rem;transition:.2s;font-family:inherit;
  }
  .filter:hover,.filter.active{background:#2c2c2c;color:#fff;border-color:#2c2c2c}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px;padding-bottom:80px}
  .product{background:#fff;border-radius:16px;overflow:hidden;transition:.3s;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .product:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.1)}
  .product-img{
    height:220px;display:flex;align-items:center;justify-content:center;
    font-size:3rem;color:#fff;
  }
  .p1{background:linear-gradient(135deg,#8e9eab,#eef2f3)}
  .p2{background:linear-gradient(135deg,#c97b5a,#e8a87c)}
  .p3{background:linear-gradient(135deg,#2f4f3a,#6b8f71)}
  .p4{background:linear-gradient(135deg,#4b3f72,#8f7bb8)}
  .p5{background:linear-gradient(135deg,#a44a3f,#d97b6c)}
  .p6{background:linear-gradient(135deg,#3a506b,#6b8fb8)}
  .product-body{padding:20px}
  .product-body h3{font-size:1.05rem;margin-bottom:6px}
  .product-body .cat{font-size:.8rem;color:#999;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
  .product-body .price{font-weight:700;font-size:1.1rem;margin-bottom:14px;display:block}
  .product-body button{
    width:100%;padding:12px;border:none;border-radius:10px;background:#2c2c2c;color:#fff;
    font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;
  }
  .product-body button:hover{background:#c97b5a}
  @media(max-width:640px){.title h1{font-size:1.8rem}}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo">Чай · Лавка</div>
    <a href="#" class="cart">Корзина (0)</a>
  </div>
</header>

<div class="container">
  <div class="title">
    <h1>Каталог чая</h1>
    <p>6 авторских купажей ручной работы</p>
  </div>

  <div class="filters">
    <button class="filter active">Все</button>
    <button class="filter">Зелёный</button>
    <button class="filter">Чёрный</button>
    <button class="filter">Травяной</button>
  </div>

  <div class="grid">
    <div class="product">
      <div class="product-img p1">🍃</div>
      <div class="product-body">
        <div class="cat">Зелёный</div>
        <h3>Туманный улун</h3>
        <span class="price">420 ₽</span>
        <button onclick="alert('Добавлено в корзину')">В корзину</button>
      </div>
    </div>
    <div class="product">
      <div class="product-img p2">🍊</div>
      <div class="product-body">
        <div class="cat">Чёрный</div>
        <h3>Терракота</h3>
        <span class="price">390 ₽</span>
        <button onclick="alert('Добавлено в корзину')">В корзину</button>
      </div>
    </div>
    <div class="product">
      <div class="product-img p3">🌿</div>
      <div class="product-body">
        <div class="cat">Травяной</div>
        <h3>Зелёный шёпот</h3>
        <span class="price">450 ₽</span>
        <button onclick="alert('Добавлено в корзину')">В корзину</button>
      </div>
    </div>
    <div class="product">
      <div class="product-img p4">🌙</div>
      <div class="product-body">
        <div class="cat">Травяной</div>
        <h3>Ночной сад</h3>
        <span class="price">520 ₽</span>
        <button onclick="alert('Добавлено в корзину')">В корзину</button>
      </div>
    </div>
    <div class="product">
      <div class="product-img p5">🔥</div>
      <div class="product-body">
        <div class="cat">Чёрный</div>
        <h3>Красный бархат</h3>
        <span class="price">480 ₽</span>
        <button onclick="alert('Добавлено в корзину')">В корзину</button>
      </div>
    </div>
    <div class="product">
      <div class="product-img p6">💧</div>
      <div class="product-body">
        <div class="cat">Зелёный</div>
        <h3>Утренний бриз</h3>
        <span class="price">410 ₽</span>
        <button onclick="alert('Добавлено в корзину')">В корзину</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
